name: LINE notification

on:
  schedule:
    # GitHub ActionsのcronはUTC。01:00 UTC = 10:00 JST。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      race_date:
        description: "開催日 YYYY-MM-DD（空欄ならJST当日）"
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: exhibition-monitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest exhibition state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("exhibition-state-")))] | sort_by(.created_at) | last | if . == null then "" else [.workflow_run.id, .name] | @tsv end')
          if [ -n "$latest" ]; then
            IFS=$'\t' read -r run_id artifact_name <<< "$latest"
            gh run download "$run_id" --name "$artifact_name" --dir data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Analyze and send to LINE
        shell: bash
        run: |
          if [ -n "${{ inputs.race_date }}" ]; then
            python -m boatrace_ai --date "${{ inputs.race_date }}" --notify-line
          else
            python -m boatrace_ai --notify-line
          fi
      - name: Save exhibition state
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-state-${{ github.run_id }}
          path: data/boatrace.sqlite3
          retention-days: 2
          if-no-files-found: error
