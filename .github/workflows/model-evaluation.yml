name: Model evaluation

on:
  schedule:
    # 毎週日曜22:30 JST
    - cron: "30 13 * * 0"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: exhibition-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("exhibition-state-")))] | sort_by(.created_at) | last | if . == null then "" else [.workflow_run.id, .name] | @tsv end')
          if [ -n "$latest" ]; then
            IFS=$'\t' read -r run_id artifact_name <<< "$latest"
            gh run download "$run_id" --name "$artifact_name" --dir data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Leakage-safe model evaluation
        run: python -m boatrace_ai --db data/boatrace.sqlite3 --evaluate-model
      - name: Save history
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-state-${{ github.run_id }}
          path: data/boatrace.sqlite3
          retention-days: 14
          if-no-files-found: error
      - name: Save evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: artifacts/learning-report.json
          retention-days: 30
          if-no-files-found: error
