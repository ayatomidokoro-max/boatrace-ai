name: Exhibition monitor

on:
  schedule:
    # 23:00〜12:50 UTC = 08:00〜21:50 JST。10分間隔。
    - cron: "*/10 23,0-12 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: exhibition-monitor
      cancel-in-progress: false
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest exhibition state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("exhibition-state-")))] | sort_by(.created_at) | last | if . == null then "" else [.workflow_run.id, .name] | @tsv end')
          if [ -n "$latest" ]; then
            IFS=$'\t' read -r run_id artifact_name <<< "$latest"
            gh run download "$run_id" --name "$artifact_name" --dir data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Detect important exhibition changes
        run: python -m boatrace_ai --db data/boatrace.sqlite3 --monitor-exhibition --notify-line
      - name: Save exhibition state
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-state-${{ github.run_id }}
          path: data/boatrace.sqlite3
          retention-days: 2
          if-no-files-found: error

